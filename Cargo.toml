[package]
name = "fluid-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.31.1"
rand = "0.8"
rayon = "1.10"
rfd = "0.15"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
